# =================================================
# Hyprland Config — "Old Reliable" V1 Syntax Fix
# =================================================
# --- Monitors ---
monitor = ,preferred,auto,1

# --- Autostart ---
exec-once = ~/.config/hypr/xdg-portal-hyprland              # XDG desktop portal for Wayland (screen share, file picker, etc.)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP  # Pass Wayland env vars to DBus/systemd services
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP           # Import Wayland env vars into user systemd session
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1  # Polkit agent — handles permission popups (sudo GUI prompts)
exec-once = awww-daemon                                 # Wallpaper daemon (needed before setting any wallpaper)
exec-once = waybar                                           # Status bar
exec-once = mako                                             # Notification daemon
exec-once = blueman-applet                                   # Bluetooth tray applet
exec-once = nm-applet --indicator                            # Network Manager tray applet
exec-once = wl-paste --watch cliphist store                  # Clipboard manager — watches clipboard and saves history

exec-once = sh -c 'sleep 2 && ~/.config/HyprV/hyprv_util setbg'
# --- Input ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}
# --- Gestures ---
gesture = 3, horizontal, workspace      # 3-finger swipe left/right → switch workspaces
gesture = 3, up, dispatcher, togglespecialworkspace # 3-finger swipe up → toggle special workspace
gesture = 3, down, dispatcher, togglespecialworkspace # 3-finger swipe down → toggle special workspace
gesture = 3, pinchout, fullscreen       # 3-finger pinch out → fullscreen
gesture = 3, pinchin, fullscreen        # 3-finger pinch in → exit fullscreen
# --- General ---
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 1
    layout = dwindle
    col.active_border = rgb(cdd6f4)
    col.inactive_border = rgba(595959aa)
}
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}
# --- Decoration ---
decoration {
    rounding = 5
    blur {
        enabled = true
        size = 7
        passes = 4
        new_optimizations = true
    }
}
# --- Animations ---
animations {
    enabled = true
    bezier = myBezier, 0.10, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier, slide
    animation = windowsOut, 1, 7, myBezier, slide
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}
# --- Layouts ---
dwindle {
    preserve_split = true
}
master {
    new_on_top = true
}
# --- Window Rules ---
# 1. Floating Rules
# Grouping all apps into one regex to minimize parser lines
windowrule = float on, match:class ^(pavucontrol|blueman-manager|nm-connection-editor|thunar|chromium|btop|update-sys)$
# 2. Opacity Rules (Standard 0.8)
windowrule = opacity 0.8 override 0.8 override, match:class ^(kitty|thunar|VSCodium|wofi)$
# 3. Specific Opacity
windowrule = opacity 0.95 override 0.95 override, match:class ^(viewnior)$
# 4. No Animation
windowrule = no_anim on, match:class ^(wofi)$
# --- Main Mod ---
$mainMod = SUPER
# --- Keybinds ---
bind = $mainMod, T, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, F, exec, firefox
bind = $mainMod, L, exec, swaylock
bind = $mainMod, M, exec, wlogout --protocol layer-shell
bind = $mainMod SHIFT, M, exit
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating
bind = $mainMod, SPACE, exec, wofi
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, swapwithmaster
bind = $mainMod, S, exec, ~/.config/hypr/screenshot.sh
bind = ALT, V, exec, cliphist list | wofi -dmenu | cliphist decode | wl-copy
bind = ALT, DELETE, exec, cliphist list | wofi --dmenu | cliphist delete
bind = $mainMod SHIFT, V, exec, ~/.config/HyprV/hyprv_util vswitch
bind = $mainMod SHIFT, R, exec, hyprctl reload && notify-send "Hyprland Reloaded"
# --- Focus ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
# --- Move windows ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
# --- Scroll ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
# --- Mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# --- Sources ---
source = ~/.config/HyprV/hypr/media-binds.conf
source = ~/.config/HyprV/hypr/env_var.conf
